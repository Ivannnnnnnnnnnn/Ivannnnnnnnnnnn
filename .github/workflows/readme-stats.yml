name: Generate README cards

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - name: Create profile folder
        run: mkdir -p profile

      - name: Download stats SVG
        run: |
          curl -L "https://github-readme-stats.vercel.app/api?username=Ivannnnnnnnnnnn&show_icons=true&theme=dark" -o profile/stats.svg

      - name: Download top languages SVG
        run: |
          curl -L "https://github-readme-stats.vercel.app/api/top-langs/?username=Ivannnnnnnnnnnn&layout=compact&theme=dark&langs_count=8" -o profile/top-langs.svg

      - name: Commit SVGs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "update svg cards" || exit 0
          git push
